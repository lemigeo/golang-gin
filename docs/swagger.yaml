basePath: /
consumes:
- application/json
definitions:
  domain.CustomerResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  domain.LoginRequest:
    properties:
      email:
        description: Email login only.
        maxLength: 255
        type: string
      mediaId:
        description: Social login only.
        maxLength: 255
        type: string
      mediaName:
        allOf:
        - $ref: '#/definitions/domain.MediaName'
        enum:
        - email
        - kakao
        - naver
      mediaToken:
        type: string
      password:
        maxLength: 128
        type: string
    required:
    - mediaName
    type: object
  domain.LoginResponse:
    properties:
      customer:
        $ref: '#/definitions/domain.CustomerResponse'
      expires_at:
        type: string
      token:
        type: string
    type: object
  domain.MediaName:
    enum:
    - email
    - kakao
    - naver
    type: string
    x-enum-varnames:
    - MediaEmail
    - MediaKakao
    - MediaNaver
  domain.SignUpRequest:
    properties:
      email:
        maxLength: 255
        type: string
      mediaId:
        maxLength: 255
        type: string
      mediaName:
        allOf:
        - $ref: '#/definitions/domain.MediaName'
        enum:
        - email
        - kakao
        - naver
      mediaToken:
        type: string
      name:
        description: |-
          Social sign-up only. The name comes from the verified profile, so it is
          required only for the email flow.
        maxLength: 64
        type: string
      password:
        description: Email sign-up only.
        maxLength: 128
        minLength: 8
        type: string
    required:
    - email
    - mediaName
    type: object
  response.Body:
    properties:
      code:
        type: integer
      message:
        type: string
    type: object
  response.ErrorBody:
    properties:
      error:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: |-
    Customer sign-up API. Endpoint specs live in the
    handler annotations, not in README.md.
  title: golang-gin API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: mediaName decides which fields are required
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.LoginResponse'
        "400":
          description: validation failed
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "401":
          description: wrong credentials, or social token rejected
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "403":
          description: customer is not active
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "404":
          description: social account verified but not registered
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorBody'
      summary: Log in with an email or a social account
      tags:
      - auth
  /auth/signup:
    post:
      consumes:
      - application/json
      parameters:
      - description: mediaName decides which fields are required
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.SignUpRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.CustomerResponse'
        "400":
          description: validation failed
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "401":
          description: social token rejected, or mediaId does not match the verified
            profile
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "409":
          description: email or social account already registered
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorBody'
      summary: Sign up with an email or a social account
      tags:
      - auth
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
      summary: Liveness probe
      tags:
      - system
produces:
- application/json
swagger: "2.0"
